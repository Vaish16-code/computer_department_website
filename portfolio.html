<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Portfolio - Comps</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/about.css">
    <link rel="stylesheet" href="css/faculty.css">
    <link rel="stylesheet" href="css/navbar-footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
    #mobile-menu-btn {
        display: none !important;
    }
    </style>

</head>
<body>
    <div id="navbar-placeholder"></div>

    <section class="page-hero">
  <div class="container">
    <div class="page-hero-content">
      <h1 id="prof-name"></h1>
      <p id="prof-designation"></p>
      <div class="hero-stats">
        <div class="stat-item">
          <span class="stat-label">Email</span>
          <span class="stat-header" id="prof-email"></span>
        </div>
        <div class="stat-item">
          <span class="stat-label">LinkedIn</span>
          <span class="stat-header" id="prof-linkedin">View Profile</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Experience</span>
          <span class="stat-header" id="prof-exp"></span>
        </div>
      </div>
    </div>
  </div>
</section>


    <section class="portfolio-details container">
        <div class="info-card" style="margin-top: 20px;">
            <h3>About</h3>
            <p id="prof-about">Loading biography...</p>
        </div>

        
    <section>
    <div class="sub-container portfolio-grid">
        
        <div class="resume-col">
            <h2 class="section-title-left">Education</h2>
            <div id="education-list" class="timeline portfolio-timeline">
                </div>
        </div>

        <div class="resume-col">
            <h2 class="section-title-left">Experience</h2>
            <div id="experience-list" class="timeline portfolio-timeline">
                </div>
        </div>
        
    </div>
</section>
        

        <div id="highlights-section" style="padding:0 0 2rem">
            <h2 style="margin-bottom: 20px;">Professional Highlights</h2>
            <div id="highlights-grid" class="achievements-grid"></div>
        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="js/faculty-data.js"></script>
    <script src="js/portfolio-loader.js"></script>
    <script src="js/components.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
